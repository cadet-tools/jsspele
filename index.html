const STATIONS=[{"id": 1, "title": "Strēlnieku sākums", "tag": "Vēsture · Pirmais pasaules karš", "code": "OZOLS47", "icon": "01", "intro": "Atrodiet 1. punkta liecību. Noskaidrojiet, kā radās latviešu strēlnieku vienības. Katrā atbildē balstieties uz atrasto materiālu.", "questions": [{"label": "Kurā gadā izveidoja latviešu strēlnieku bataljonus?", "options": ["1914.", "1915.", "1918.", "1939."], "correct": 1, "why": "Bataljonus sāka veidot 1915. gadā, kad karadarbība bija skārusi Latvijas teritoriju.", "kind": "select"}, {"label": "Kuras armijas sastāvā bataljonus izveidoja?", "options": ["Latvijas Republikas armijas", "Vācijas impērijas armijas", "Krievijas impērijas armijas", "PSRS Sarkanās armijas"], "correct": 2, "why": "1915. gadā neatkarīgas Latvijas valsts vēl nebija. Bataljoni bija Krievijas impērijas armijas daļa.", "kind": "select"}, {"label": "Kāpēc 1915. gada apstākļos radās nepieciešamība pēc latviešu strēlnieku vienībām? Uzrakstiet 1–2 teikumus.", "kind": "text"}]}, {"id": 2, "title": "Divas kauju vietas", "tag": "Vēsture · Liecību salīdzināšana", "code": "TIRELIS28", "icon": "02", "intro": "Izlasiet liecības A un B uz 2. punkta lapas. Pievērsiet uzmanību vietām un tam, ko karavīri tajās darīja.", "questions": [{"label": "Kurai vietai atbilst liecība A?", "options": ["Nāves salai", "Ložmetējkalnam", "Kurzemes frontei 1944.–1945. gadā"], "correct": 0, "why": "Liecībā A minētas aizsardzības pozīcijas Daugavas kreisajā krastā pie Ikšķiles — Nāves sala.", "kind": "select"}, {"label": "Ar kurām kaujām saistīta liecība B?", "options": ["Latvijas Neatkarības karu", "Ziemassvētku kaujām Pirmajā pasaules karā", "Otro pasaules karu"], "correct": 1, "why": "Tīreļpurvs un Ložmetējkalns ir saistīti ar Pirmā pasaules kara Ziemassvētku kaujām.", "kind": "select"}, {"label": "Kura ir abām liecībām kopīga pazīme?", "options": ["Abās runāts par latviešu strēlnieku dalību Pirmajā pasaules karā", "Abās runāts par Latvijas armiju 1939. gadā", "Abās runāts par jūras kaujā function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{$('storage-warning').style.display='block';return false}}
function save(){store(KEY,S)}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4000)}
function go(h){if(location.hash==='#'+h)render();else location.hash=h;window.scrollTo(0,0)}
function completed(s=S){return s?STATIONS.filter(p=>s.done[p.id]).length:0}
function equal(a,b){return Array.isArray(b)?Array.isArray(a)&&a.length===b.length&&[...a].sort().join(',')===[...b].sort().join(','):a===b}
function stats(s){let points=0,total=0,open=0,maxOpen=0;STATIONS.forEach(p=>p.questions.forEach((q,i)=>{if(q.kind==='text'){maxOpen+=2;if(s?.done[p.id])open++}else{total++;if(s?.done[p.id]&&equal(s.done[p.id].answers[i],q.correct))points++}}));return{points,total,open,maxOpen}}
let S=load(KEY,null);
if(!S||S.schema!==1||!S.done||!S.drafts||!S.unlocked)S=null;
function render(){const hash=location.hash.slice(1)||'home';const m=hash.match(/^p([1-8])$/);current=m?Number(m[1]):0;$('app').innerHTML=!S?landing(current):current?station(current):hash==='report'?report():dashboard();bindForms();}
function landing(target=0){return `<section class="hero"><div><div class="eyebrow">Izej teritorijā. Atrodi. Izpēti.</div><h1>Karavīra<br><span>pēdas.</span></h1><p class="lead">Astoņi kontrolpunkti. Divi pasaules kari. Vērtības, kas nosaka rīcību. Dodieties misijā un pamatojiet katru atradumu.</p><div class="chips"><span class="chip">3–4 dalībnieki grupā</span><span class="chip">1 telefons</span><span class="chip">48 min maršrutam</span></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 400 290" fill="none"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#5b4734" stroke-width=".5"/></pattern></defs><rect width="400" height="290" fill="url(#grid)"/><path d="M60 205 115 125 190 185 253 88 330 140" stroke="#d5a16b" stroke-width="2" stroke-dasharray="5 6"/><circle cx="190" cy="145" r="110" stroke="#584333"/><circle cx="190" cy="145" r="75" stroke="#584333"/>${[[60,205,'01'],[115,125,'03'],[190,185,'05'],[253,88,'07'],[330,140,'08']].map(([x,y,t])=>`<circle cx="${x}" cy="${y}" r="18" fill="#30251c" stroke="#e9b87c"/><text x="${x}" y="${y+4}" fill="#f7d9b1" font-size="10" text-anchor="middle" font-family="sans-serif">${t}</text>`).join('')}</svg><span class="art-label">8 PUNKTI / VIENA KOMANDA</span></div></section><section class="panel"><h2>Piesakiet savu grupu</h2>${target?`<div class="notice">Atvērts ${target}. kontrolpunkts. Vispirms ievadiet grupas nosaukumu.</div>`:''}<form id="start-form"><div class="field-row"><div><label class="field" for="group-name">Grupas nosaukums</label><input id="group-name" name="group" maxlength="40" required placeholder="Piemēram, Lūši" autocomplete="off"></div><div><label class="field" for="members">Dalībnieki</label><select id="members" name="members"><option value="3">3 dalībnieki</option><option value="4" selected>4 dalībnieki</option><option value="2">2 dalībnieki</option><option value="5">5 dalībnieki</option></select></div></div><div class="actions"><button type="submit" class="primary">${target?'Sākt un atvērt punktu':'Sākt misiju'} →</button></div></form><p class="small" style="margin-top:16px">Atbildes glabājas šajā pārlūkā. Izmantojiet vienu telefonu un vienu pārlūku visā maršrutā. Noslēgumā parādiet vai lejupielādējiet pārskatu; instruktoram tas netiek nosūtīts automātiski.</p></section><section class="grid3"><div class="step"><b>1</b><div><h3>Atrodiet punktu</h3><p>Sekojiet instruktora norādītajai shēmai. Grupas sāk dažādos punktos.</p></div></div><div class="step"><b>2</b><div><h3>Izpētiet liecību</h3><p>Ievadiet lapā redzamo piekļuves kodu. Izlasiet materiālu, salīdziniet un vienojieties.</p></div></div><div class="step"><b>3</b><div><h3>Pamatojiet atbildi</h3><p>Iesniedziet atbildes un izlasiet skaidrojumu. Nākamajā punktā mainiet pienākumus.</p></div></div></section>`}
function dashboard(){const st=stats(S),n=completed();return `<div class="eyebrow">Grupas misija</div><div class="statusline"><div><h1 style="font-size:42px">${esc(S.group)}</h1><p class="small">${S.members} dalībnieki · palieciet kopā instruktora norādītajā teritorijā</p></div><button class="quiet" onclick="go('report')">Grupas pārskats ↗</button></div><section class="panel"><div class="statusline"><strong>${n} no 8 punktiem izpildīti</strong><span class="small">Automātiski pārbaudīts: ${st.points} / ${st.total} p.</span></div><div class="progress" role="progressbar" aria-label="Maršruta progress" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="8"><span style="width:${n*12.5}%"></span></div></section><div class="notice">Atrodiet kontrolpunktu un uz tā lapas norādīto kodu. Sākt drīkst jebkurā punktā. Katrā nākamajā punktā mainiet lasītāju, atbilžu ievadītāju un pārbaudītāju.</div><div class="station-grid">${STATIONS.map(p=>`<button class="station-card ${S.done[p.id]?'done':''}" onclick="go('p${p.id}')"><span class="num">${p.icon}</span><span><h3>${p.title}</h3><span class="tag">${p.tag}</span><div class="state">${S.done[p.id]?'✓ Izpildīts · apskatīt skaidrojumu':S.unlocked[p.id]?'Turpināt uzdevumu →':'Atvērt kontrolpunktu →'}</div></span></button>`).join('')}</div>${n===8?`<div class="panel" style="margin-top:24px"><span class="finish-badge">MARŠRUTS IZPILDĪTS</span><h2 style="margin-top:12px">Laiks atgriezties.</h2><p>Dodieties pie instruktora un sagatavojiet vienu vēstures secinājumu un vienu pamatotu rīcības piemēru.</p><button class="primary" onclick="go('report')">Atvērt noslēguma pārskatu →</button></div>`:''}`}
function reference(){const sets=[['Vispārējās pakāpes — no zemākās uz augstāko',[['Kareivis','kareivis'],['Dižkareivis','dizkareivis'],['Kaprālis','kapralis'],['Seržants','serzants'],['Leitnants','leitnants'],['Virsleitnants','virsleitnants'],['Kapteinis','kapteinis'],['Majors','majors']]],['Jūras spēku piemēri',[['Matrozis','matrozis'],['Dižmatrozis','dizmatrozis'],['Kapteiņleitnants','kapteinleitnants'],['Komandleitnants','komandleitnants']]]];return `<details><summary>Atvērt pakāpju atgādni</summary><p class="small">Izlase no nodarbības plāna pielikuma; starp seržantu un leitnantu ir arī citas instruktoru pakāpes, kas šajā izlasē nav parādītas.</p>${sets.map(([t,list])=>`<h3>${t}</h3><div class="reference-grid">${list.map(([name,key])=>`<div class="ref"><img src="${ASSETS[key]}" alt="${name} pakāpes zīme">${name}</div>`).join('')}</div><br>`).join('')}</details>`}
function station(id){const p=STATIONS[id-1],done=S.done[id],open=S.unlocked[id];let html=`<div class="narrow"><button class="back quiet" onclick="go('home')">← Visi kontrolpunkti</button><div class="station-head"><div class="station-number">${p.icon}</div><div><div class="eyebrow">${p.tag}</div><h1>${p.title}</h1></div></div>`;if(!open&&!done)return html+`<section class="panel"><h3>Atrodiet punkta kodu</h3><p class="small">Kods ir redzams uz ${id}. kontrolpunkta lapas. Ievadiet to, lai atvērtu uzdevumu.</p><form id="unlock-form"><label class="field" for="point-code">Piekļuves kods</label><input id="point-code" name="code" required maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Kods no kontrolpunkta lapas"><div id="unlock-error" class="notice error" role="alert" hidden></div><div class="actions"><button type="submit" class="primary">Atvērt uzdevumu →</button></div></form></section></div>`;if(done)return html+stationFeedback(p,done)+`<div class="actions"><button class="primary" onclick="go('home')">Pie pārējiem punktiem →</button><button onclick="go('report')">Pārskats</button></div></div>`;
return html+`<p>${p.intro}</p><div class="notice"><span class="role">Pienākumu maiņa</span><br>Vienojieties, kurš šeit lasa, kurš ievada atbildes un kurš pārbauda pamatojumu. Atbildi iesniedziet tikai pēc kopīgas apspriedes.</div>${id>=6?reference():''}<form id="answers-form" class="panel">${p.questions.map((q,i)=>questionHTML(q,i,S.drafts[id]?.[i])).join('')}<div id="answer-error" class="notice error" role="alert" hidden></div><p class="small">Pēc iesniegšanas atbildes tiek fiksētas un parādīts skaidrojums. Rakstiskos pamatojumus izvērtēs instruktors.</p><div class="actions"><button type="submit" class="primary">Iesniegt punkta atbildes →</button></div><div id="draft-status" class="small" style="margin-top:10px" role="status">Melnraksts saglabājas rakstīšanas laikā.</div></form></div>`}
function questionHTML(q,i,a){let s=`<fieldset class="question"><legend>${i+1}. ${esc(q.label)}</legend>`;if(q.kind==='text')s+=`<label class="sr-only" for="q${i}">Jūsu pamatojums</label><textarea id="q${i}" name="q${i}" maxlength="1000" minlength="10" required placeholder="Vienojieties un paskaidrojiet saviem vārdiem…">${esc(a||'')}</textarea><div class="small">Instruktora vērtējums: līdz 2 punktiem.</div>`;else if(q.kind==='multi')s+=q.options.map((v,j)=>`<label class="option"><input type="checkbox" name="q${i}" value="${j}" ${Array.isArray(a)&&a.includes(j)?'checked':''}><span>${esc(v)}</span></label>`).join('');else s+=`<label class="sr-only" for="q${i}">Izvēlieties atbildi</label><select id="q${i}" name="q${i}" required><option value="">Izvēlieties atbildi…</option>${q.options.map((v,j)=>`<option value="${j}" ${a===j?'selected':''}>${esc(v)}</option>`).join('')}</select>`;return s+'</fieldset>'}
function answerLabel(q,a){return q.kind==='text'?String(a||''):Array.isArray(a)?a.map(j=>q.options[j]).join(', '):q.options[a]||'Nav atbildes'}
function stationFeedback(p,done){let score=0,max=0;const rows=p.questions.map((q,i)=>{const a=done.answers[i],written=q.kind==='text',ok=!written&&equal(a,q.correct);if(!written){max++;if(ok)score++}return `<div class="feedback"><div class="mark ${written?'pending':ok?'':'bad'}">${written?'◷ Pamatojums — vērtē instruktors':ok?'✓ Pareizi · 1 p.':'○ Jāpārrunā · 0 p.'}</div><p><strong>${i+1}. ${esc(q.label)}</strong></p><p class="answer-text">${esc(answerLabel(q,a))}</p>${written?'<p class="small">Sagatavojieties savu pamatojumu izstāstīt noslēguma pārrunās.</p>':`<p class="small">${esc(q.why)}</p>`}</div>`}).join('');return `<div class="notice success">Punkts izpildīts. Automātiski pārbaudīts: <b>${score} / ${max} p.</b> Izlasiet skaidrojumus, pirms dodaties tālāk.</div><section class="panel">${rows}</section>`}
function report(){const t=stats(S),n=completed();return `<button class="back quiet" onclick="go('home')">← Atpakaļ maršrutā</button><div class="eyebrow">Grupas pārskats · ${n===8?'misija izpildīta':'misija turpinās'}</div><h1 style="font-size:46px">${esc(S.group)}</h1><div class="grid3"><div class="panel"><div class="bigstat">${n} / 8</div><div class="stat-label">izpildīti kontrolpunkti</div></div><div class="panel"><div class="bigstat">${t.points} / ${t.total}</div><div class="stat-label">automātiski pārbaudītie punkti</div></div><div class="panel"><div class="bigstat">${t.open}</div><div class="stat-label">pamatojumi instruktora izvērtēšanai</div></div></div><div class="notice">Šis pārskats glabājas grupas telefonā. Parādiet to instruktoram. Ja instruktors apkopo rezultātus datorā, lejupielādējiet JSON failu un nododiet viņam ierastajā veidā.</div><div class="actions"><button class="primary" onclick="downloadReport()">Lejupielādēt rezultātus (JSON)</button><button onclick="downloadText()">Lejupielādēt lasāmu pārskatu (TXT)</button></div><div class="section-title"><h2>Atradumi un atbildes</h2></div>${STATIONS.map(p=>S.done[p.id]?`<details><summary>${p.icon} · ${p.title}</summary>${stationFeedback(p,S.done[p.id])}</details>`:`<p class="small">${p.icon} · ${p.title} — vēl nav izpildīts</p>`).join('')}<section class="panel" style="margin-top:25px"><h3>Sagatavojieties noslēguma sarunai</h3><ol><li>Kādā ziņā atšķīrās latviešu karavīru iesaiste abos pasaules karos?</li><li>Kā vērtība izpaužas konkrētā rīcībā?</li><li>Kā pēc zīmēm atpazīstat vienu vispārējo un vienu Jūras spēku pakāpi?</li></ol></section><details><summary>Sākt jaunu grupas darbu šajā ierīcē</summary><p class="small">Vispirms lejupielādējiet šo pārskatu. Jauns darbs izdzēsīs tikai šajā pārlūkā saglabātās pašreizējās grupas atbildes.</p><button class="danger" onclick="resetGroup()">Dzēst grupas darbu un sākt no jauna</button></details>`}
function bindForms(){if($('start-form'))$('start-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('group')).trim();if(!name)return;S={schema:1,id:uid(),group:name,members:Number(f.get('members')),createdAt:new Date().toISOString(),done:{},drafts:{},unlocked:{}};save();const next=current?'p'+current:'home';go(next);render()};if($('unlock-form'))$('unlock-form').onsubmit=e=>{e.preventDefault();if(normal(new FormData(e.target).get('code'))!==normal(STATIONS[current-1].code)){$('unlock-error').hidden=false;$('unlock-error').textContent='Kods neatbilst šim punktam. Pārbaudiet punkta numuru un pārrakstiet kodu.';return}S.unlocked[current]=true;save();render()};if($('answers-form')){const f=$('answers-form');f.addEventListener('input',()=>{S.drafts[current]=readAnswers(f,STATIONS[current-1]);save();$('draft-status').textContent='Melnraksts saglabāts šajā ierīcē.'});f.onsubmit=e=>{e.preventDefault();const p=STATIONS[current-1],answers=readAnswers(f,p);if(p.questions.some((q,i)=>q.kind==='multi'&&!answers[i].length||q.kind==='text'&&answers[i].trim().length<10)){$('answer-error').hidden=false;$('answer-error').textContent='Aizpildiet visas atbildes. Pamatojumā ierakstiet vismaz 10 rakstzīmes un izvēlieties prasītās atbildes.';return}S.done[current]={answers,at:new Date().toISOString()};delete S.drafts[current];save();render();window.scrollTo(0,0)}}}
function readAnswers(f,p){const d=new FormData(f);return p.questions.map((q,i)=>q.kind==='multi'?d.getAll('q'+i).map(Number):q.kind==='text'?String(d.get('q'+i)||'').trim():d.get('q'+i)===''?null:Number(d.get('q'+i)))}
function downloadFile(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function safeName(){return normal(S.group).slice(0,35)||'GRUPA'}
function downloadReport(){downloadFile('karavira-pedas-'+safeName()+'.json',JSON.stringify({format:'karavira-pedas',version:1,exportedAt:new Date().toISOString(),session:{schema:1,id:S.id,group:S.group,members:S.members,createdAt:S.createdAt,done:S.done}},null,2),'application/json');toast('Pārskats sagatavots lejupielādei.')}
function downloadText(){const t=stats(S);let txt=`KARAVĪRA PĒDAS\nGrupa: ${S.group}\nIzpildīti punkti: ${completed()}/8\nAutomātiski pārbaudīts: ${t.points}/${t.total} p.\nPamatojumi: ${t.open} (vērtē instruktors)\n\n`;STATIONS.forEach(p=>{txt+=`${p.id}. ${p.title}\n`;const d=S.done[p.id];if(!d){txt+='Nav izpildīts.\n\n';return}p.questions.forEach((q,i)=>{txt+=`${i+1}. ${q.label}\nAtbilde: ${answerLabel(q,d.answers[i])}\n${q.kind==='text'?'Vērtē instruktors.':q.why}\n\n`})});downloadFile('karavira-pedas-'+safeName()+'.txt',txt,'text/plain;charset=utf-8')}
function resetGroup(){if(!confirm('Vai dzēst šīs grupas atbildes no šī pārlūka? Pirms dzēšanas lejupielādējiet pārskatu.'))return;S=null;save();go('home');render()}
window.addEventListener('hashchange',render);
render();</script></body></html>
