function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{$('storage-warning').style.display='block';return false}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4000)}
function qrSvg(value,size=200){const qr=qrcode(0,'M');qr.addData(value,'Byte');qr.make();const n=qr.getModuleCount(),s=n+8;let path='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))path+=`M${c+4},${r+4}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${size}" height="${size}" role="img" aria-label="QR kods" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="white"/><path d="${path}" fill="black"/></svg>`}
function pointURL(id){return baseURL()+(id?'#p'+id:'#home')}
function qrBox(id,large=false){if(!baseURL())return '<p class="small">QR kodam instruktoram jānorāda publicētās lapas saite.</p>';try{return `<div class="qr-box ${large?'large':''}">${qrSvg(pointURL(id),large?260:150)}</div>`}catch{return '<p class="small">Saite ir pārāk gara QR kodam. Izmantojiet īsāku publisko adresi.</p>'}}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Pilnekrānam izmantojiet pārlūka F11.'))}
function baseURL(){try{const u=new URL(config.url.trim());if(!/^https?:$/.test(u.protocol)||u.username||u.password)return '';u.hash='';return u.href}catch{return ''}}
let config={url:'',places:{}},rows=[];
function useProjectorData(d){if(!d||d.format!=='karavira-pedas-projector'||d.version!==1||!d.config||typeof d.config.url!=='string'||!Array.isArray(d.rows))throw Error('Neatbilstošs projektora datu fails');
 let url='';if(d.config.url){const u=new URL(d.config.url);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('Nederīga saite');u.hash='';url=u.href}
 const places={};for(let i=1;i<=8;i++)places[i]=String(d.config.places?.[i]||'').slice(0,80);
 const clean=d.rows.slice(0,200).map(r=>{if(typeof r.group!=='string'||r.group.length>40)throw Error('Nederīgi grupas dati');for(const k of ['completed','points','total','manual','maxManual','pending'])if(!Number.isInteger(r[k])||r[k]<0||r[k]>100)throw Error('Nederīgi rezultāti');return {group:r.group,completed:r.completed,points:r.points,total:r.total,manual:r.manual,maxManual:r.maxManual,pending:r.pending}});
 config={url,places};rows=clean;store(KEY+'-projector',{format:d.format,version:1,config,rows});
}
function hydrate(){try{if(location.hash.startsWith('#data=')){useProjectorData(JSON.parse(decodeURIComponent(location.hash.slice(6))));history.replaceState(null,'',location.pathname+location.search)}else{const d=load(KEY+'-projector',null);if(d)useProjectorData(d)}}catch(e){toast('Neizdevās ielādēt projektora datus. Izvēlieties JSON failu.')}}
async function importProjector(files){if(!files.length)return;try{if(files[0].size>300000)throw Error('Fails ir pārāk liels');useProjectorData(JSON.parse(await files[0].text()));render();toast('Projektora dati ielādēti.')}catch(e){toast(e.message)}}
function render(){$('app').innerHTML=projector();}
function rosterHTML(){if(!rows.length)return '<div class="notice">Vēl nav grupu rezultātu. Instruktora failā saglabā projektora datus un ielādē tos šeit.</div>';return `<div class="table-scroll"><table><thead><tr><th>Grupa</th><th>Kontrolpunkti</th><th>Automātiski</th><th>Pamatojumi</th><th>Kopā</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.group)}</b></td><td>${r.completed}/8</td><td>${r.points}/${r.total}</td><td>${r.manual}/${r.maxManual}${r.pending?'<br><small>Jāvērtē: '+r.pending+'</small>':''}</td><td><b>${r.points+r.manual}/${r.total+r.maxManual}</b>${r.pending?'<br><small>Pagaidu rezultāts</small>':''}</td></tr>`).join('')}</tbody></table></div>`}
window.addEventListener('storage',e=>{if(e.key===KEY+'-projector'){try{useProjectorData(JSON.parse(e.newValue));render()}catch{}}});
window.addEventListener('hashchange',()=>{hydrate();render()});
function projector(){let inner='';if(projectTab==='start')inner=`<div class="project-start"><div><div class="eyebrow">Izziņas orientēšanās · 2 × 40 min</div><h1>Atrodi.<br>Izpēti.<br><span style="color:var(--accent)">Pamato.</span></h1><p style="font-size:21px;color:var(--muted)">8 kontrolpunkti · viens telefons grupai<br>Par atbildi atbild visa komanda.</p></div><div>${qrBox(0,true)}<p class="small" style="margin-top:12px">Noskenējiet sākuma QR kodu un ievadiet grupas nosaukumu.</p></div></div><div class="timeline">${[['08','min · ievads'],['48','min · maršruts'],['19','min · pārrunas'],['05','min · pārbaude']].map(([n,t])=>`<div class="panel"><strong>${n}</strong><br><span class="small">${t}</span></div>`).join('')}</div><div class="panel" style="margin-top:22px"><h3>Pirms starta vienojamies</h3><ol><li>Kur ir teritorijas robežas un kad jāatgriežas?</li><li>Kurā punktā sāk katra grupa? Tālāk ejam pa apli.</li><li>Katrā punktā mainām pienākumus; kustamies kopā.</li><li>Punktus dod par pareizību un pamatojumu. Ātrums punktus nedod.</li></ol></div>${Object.values(config.places).some(Boolean)?`<section class="panel"><h3>Kontrolpunktu vietas</h3><div class="table-scroll"><table>${STATIONS.map(p=>`<tr><td>${p.icon} · ${p.title}</td><td>${esc(config.places[p.id]||'Norāda instruktors')}</td></tr>`).join('')}</table></div></section>`:''}`;else if(projectTab==='debrief')inner=`<div class="eyebrow">19 minūtes · kopīga izpratne</div><h1>Ko jūs atklājāt?</h1><div class="prompt">01 · Kā atšķīrās latviešu karavīru iesaiste abos pasaules karos?</div><div class="prompt">02 · Kāpēc dienesta piederība viena pati nepierāda brīvprātīgu izvēli?</div><div class="prompt">03 · Kā atšķiras karavīra vērtība un rīcības standarts?</div><div class="prompt">04 · Kurā situācijā jūsu grupai bija dažādi viedokļi? Kā vienojāties?</div><div class="notice">Vispirms dod atbildēt grupām. Tad precizē ar kontrolpunktu materiāliem. Katram dalībniekam jāspēj izskaidrot vismaz viens secinājums.</div>`;else if(projectTab==='exit')inner=`<div class="eyebrow">5 minūtes · katrs atbild individuāli</div><h1>Parādi, ko saprati.</h1><div class="exit-grid"><div class="exit-card"><h3>1. Vēsture</h3><p>Nosauc vienu atšķirību latviešu karavīru iesaistē Pirmajā un Otrajā pasaules karā.</p></div><div class="exit-card"><h3>2. Vērtība un standarts</h3><p>Pamani ekipējuma bojājumu un ziņo instruktoram. Nosauc saistītu vērtību un standartu; izskaidro savu izvēli.</p></div><div class="exit-card"><h3>3. Vispārējā pakāpe</h3><img src="${ASSETS.serzants}" alt="Atpazīstama pakāpes zīme"><p>Kāda pakāpe redzama? Kuram sastāvam tā pieder?</p></div><div class="exit-card"><h3>4. Jūras spēku pakāpe</h3><img src="${ASSETS.dizmatrozis}" alt="Atpazīstama Jūras spēku pakāpes zīme"><p>Kāda pakāpe redzama? Kura vispārējā pakāpe tai atbilst?</p></div></div>`;else inner=`<div class="eyebrow">Noslēguma rezultāti</div><h1>Komandu paveiktais</h1><p class="small">Rādīts no instruktora faila saņemtais rezultātu kopsavilkums. Ja faili atvērti lokāli, pēc vērtēšanas atver projektoru no instruktora faila vēlreiz vai ielādē jaunāko JSON.</p>${rosterHTML(false)}`;return `<section class="projector"><div class="project-actions">${[['start','Sākums'],['debrief','Pārrunas'],['exit','Individuālā pārbaude'],['results','Rezultāti']].map(([id,t])=>`<button class="${projectTab===id?'primary':'quiet'}" onclick="projectTab='${id}';render()">${t}</button>`).join('')}<button class="quiet" onclick="fullscreen()">Pilnekrāns ↗</button><button class="quiet" onclick="document.getElementById('projector-import').click()">Ielādēt projektora datus</button><input id="projector-import" type="file" accept=".json,application/json" hidden onchange="importProjector(this.files)"></div>${inner}</section>`}
hydrate();
render();</script></body></html>
